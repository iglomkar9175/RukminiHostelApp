name: Build Rukmini Hostel APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle executable
        working-directory: RukminiHostelApp
        run: chmod +x gradlew

      - name: Build APK
        working-directory: RukminiHostelApp
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rukmini-Hostel-APK
          path: RukminiHostelApp/app/build/outputs/apk/debug/*.apk
          
